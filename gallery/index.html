n>中国 · 上海 · 同济大学</span></p><a href="mailto:jiangyongkang@tongji.edu.cn"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-mail" aria-hidden="true"><path d="m22 7-8.991 5.727a2 2 0 0 1-2.009 0L2 7"></path><rect x="2" y="4" width="20" height="16" rx="2"></rect></svg>jiangyongkang@tongji.edu.cn</a></div></div><div class="lab-footer-bottom"><span>© <!-- -->2026<!-- --> <!-- -->空中物理交互实验室<!-- --> · <!-- -->同济大学 · 自主智能无人系统全国重点实验室</span></div></div></footer><dialog class="lab-modal" aria-labelledby="lab-modal-title"></dialog></div></div><script type="application/json" id="lab-content" data-page="gallery" data-root-prefix="../">{"site":{"labName":"空中物理交互实验室","enName":"Aerial Physical Interaction Lab","tagline":"让无人机从空中观察，\n走向与环境交互。","description":"我们研究机器人如何通过结构、感知与控制的协同设计，在复杂环境中可靠地接触、抓取、对接和驻留。以空中物理交互为核心，探索形态智能与自主作业，让无人机成为能够与物理世界持续交互的具身系统。","email":"jiangyongkang@tongji.edu.cn","affiliation":"同济大学 · 自主智能无人系统全国重点实验室","scholar":"https://scholar.google.com/citations?user=xp0Y7bsAAAAJ&hl=en&oi=ao","heroImage":"../media/hero-campus.jpg","heroVideo":"../media/docking.mp4","heroVideoPoster":"../media/docking-poster.jpg","recruitment":"欢迎对机器人机构、空中物理交互、感知与控制感兴趣的同学联系交流。\n我们重视扎实的基础、独立思考与动手实验。来信可附个人简历、研究兴趣和能够说明工作能力的项目或作品。","location":"中国 · 上海 · 同济大学","piName":"蒋永康","piTitle":"助理教授 · 课题组负责人","piBio":"蒋永康，同济大学自主智能无人系统全国重点实验室教师，“空中物理交互实验室”与“地下自然洞穴复合环境模拟实验室”负责人。\n本科与博士均毕业于北京航空航天大学，曾在瑞士洛桑联邦理工学院（EPFL）开展访问研究。聚焦智能机器人、空中无人系统与具身交互，研究机构、感知与控制如何协同支撑真实环境中的自主作业。","piPhoto":"../media/jiang-yongkang.jpg","piProfile":"https://faculty.tongji.edu.cn/jiangyongkang/zh_CN/index.htm","showPublications":true,"piDetails":{"intro":"蒋永康，同济大学自主智能无人系统全国重点实验室，上海市“晨光学者”，上海市“东方英才”团队核心骨干。本博毕业于北京航空航天大学，瑞士洛桑联邦理工学院（EPFL）访问学者。同济大学“空中物理交互实验室”与“地下自然洞穴复合环境模拟实验室”负责人，聚焦智能机器人、空中无人系统与具身交互等前沿领域研究。在Science Advances, Cell Reports Physical Science, Soft Robotics, IEEE/ASME T-MECH, IEEE TIE，IEEE RAL, BB, ICRA, IROS等国际期刊与学术会议上发表学术论文30余篇（一作/通讯20余篇），申请/授权发明专利10余项（美国专利1项），相关成果被美国两院院士/MIT教授Daniela Rus, 哈佛大学Robert Howe教授、Katia Bertoldi教授等知名学者在Science Robotics, Advanced Materials, TRO等期刊引用并高度评价。\n\n主持国自然面上，国自然青基、国家重点研发计划子课题、上海市“晨光计划”项目等，参与上海市重大专项、JKW \"1XX\"专项重点课题等项目多项。入选2025年同济大学优秀班主任，主讲课程“人工智能前沿进展与应用”入选教育部人工智能前沿主题微课程项目、同济大学研究生线上精品课程教改项目、同济大学智慧课程教改项目。作为指导教师/领队，获得2025工信部新域新质创新大赛全国二等奖、2025国际人形机器人技能大赛-具身智能应用场景挑战赛第一名等荣誉。同时，担任中国生物医学工程学会康复工程分会青年委员、国际期刊客座编辑、IEEE国际会议 Technical Committee Chairs，以及NC, T-RO,SORO, T-MECH, RA-L, ICRA, IROS等国际知名期刊与会议的审稿人。\n\n主持研发复杂自然环境自驻式无人机系统平台-“智能飞鸟”，突破无人机在密林、管道、洞穴等受限环境中的停歇、避障与持续监测难题。成果受到了xxx战区领导积极评价，入选同济大学招生宣传片，获首轮浦东人工智能种子基金支持与2025工信部新域新质创新大赛全国二等奖等重要奖励，在央视新闻频道（CCTV-13）《朝闻天下》、央视综合频道（CCTV-1）《晚间新闻》等进行综合报道。已与30余家部队单位及XX国安单位合作，签署多项产品试用意向/采购合同，已经交付产品样机参加XX演训，服务军事国防等国家重大战略需求。主持研发的“智能飞鸟”-多模态自适应无人机停歇系统，实现了在管道、岩石、电缆、墙体等多类自然与人工环境结构的自主稳定停歇，在“伪装驻留—智能感知—精准摧毁”新质战斗力生成等方面具有重要应用前景。","sourceUrl":"https://faculty.tongji.edu.cn/jiangyongkang/zh_CN/index.htm","sections":[],"education":[],"experience":[]}},"research":[{"id":"r-interaction","title":"空中物理交互与形态智能","subtitle":"Aerial interaction & morphological intelligence","summary":"把结构的力学特性融入机器人能力，研究接触、抓取与对接过程中的快速响应和飞行稳定性。","body":"空中机器人与环境发生接触时，结构响应和飞行运动会相互影响。我们结合机构设计、动力学分析与实验，探索形态智能在快速抓取、动态对接和空中操作中的作用。\n相关公开工作包括双稳态抓取机构和动态空中对接。","cover":"../media/docking-poster.jpg","video":"../media/docking.mp4","tags":["形态智能","动态对接","机器人机构"]},{"id":"r-perching","title":"自主停歇与长时驻留","subtitle":"Perching & sustained observation","summary":"利用树枝、杆件及空间结构支撑无人机，研究从飞行到停歇、驻留监测与再起飞的完整过程。","body":"停歇为无人机提供了持续接触环境、降低驻留能耗的另一种方式。我们研究环境适配结构、抓附过程与整机协同，探索面向森林生态监测、应急感知和复杂空间巡检的自驻式平台。\n智能飞鸟是这一研究方向的代表性系统。","cover":"../media/perching.jpg","video":"","tags":["自适应停歇","环境交互","智能飞鸟"]},{"id":"r-reconfigurable","title":"变刚度与可重构机器人","subtitle":"Variable stiffness & reconfigurable robotics","summary":"通过双稳态、阻塞与柔顺机构调节形态和力学性能，让机器人适应不同任务与接触条件。","body":"机器人的能力不仅来自算法，也来自结构本身。我们围绕可调刚度、能量调控与可重构机构开展研究，将物理机制与系统设计结合。\n公开成果涵盖链状颗粒阻塞、可编程双稳态执行器以及环境辅助的空中原位工具生成。","cover":"../media/morphology.jpg","video":"../media/toolmaking.mp4","tags":["变刚度","双稳态","可重构机构"]},{"id":"r-perception","title":"多模态感知与自主控制","subtitle":"Multimodal perception & autonomous control","summary":"结合视觉、触觉与运动状态信息，研究交互过程中的状态判断、感知重构与闭环控制。","body":"可靠的物理交互需要理解接触和运动状态。我们研究多模态感知、触觉重构、状态估计及感知控制协同方法，并通过真实机器人平台验证。\n相关公开研究包括面向边缘应用的数据驱动动态触觉感知，以及视觉反馈下的空中操作。","cover":"../media/toolmaking-poster.jpg","video":"../media/toolmaking.mp4","tags":["视觉与触觉","状态估计","自主作业"]}],"publications":[{"id":"cv-paper-01","title":"Morphological intelligence for dynamic aerial interactions","authors":"Jiang Yongkang#, Li Junjin#, Meng Shuyu, et al.","venue":"Science Advances","year":2026,"doi":"","url":"","image":"","status":"已接收","topic":"","details":"","kind":"期刊论文"},{"id":"cv-paper-02","title":"Autonomous Top-Perching with an Asymmetric Bistable Claw","authors":"Jiang Yongkang#, Zhang Shenli#, Liang Yida, et al.","venue":"Cell Reports Physical Science","year":2026,"doi":"","url":"","image":"","status":"已接收","topic":"","details":"","kind":"期刊论文"},{"id":"cv-paper-03","title":"Ultra-tunable bistable structures for universal robotic applications","authors":"Jiang Yongkang, Li Yingtian, Liu Ke, et al.","venue":"Cell Reports Physical Science","year":2023,"doi":"10.1016/j.xcrp.2023.101365","url":"","image":"","status":"已发表","topic":"","details":"4(5): 101365","kind":"期刊论文"},{"id":"cv-paper-05","title":"Reprogrammable bistable actuators for multimodal, fast, and ultra-sensitive grasping","authors":"Jiang Yongkang, Tong Xin, Li Jian, et al.","venue":"IEEE/ASME Transactions on Mechatronics","year":2024,"doi":"10.1109/TMECH.2023.3318976","url":"","image":"","status":"已发表","topic":"","details":"29(2): 984–994","kind":"期刊论文"},{"id":"cv-paper-06","title":"Dynamic Tactile Sensor (DTS) with Data-driven Super-resolution for Edge Applications","authors":"Zhou Yanmin, Luo Yijie, Li Jie, Wang Yafei, Wang Zhipeng, Jiang Yongkang*, He Bin","venue":"IEEE Transactions on Industrial Electronics","year":2026,"do s":"Tong Xin, ..., Jiang Yongkang, Yang Yang, Li Yingtian","venue":"Advanced Science","year":2026,"doi":"10.1002/advs.76527","url":"","image":"","status":"已发表","topic":"","details":"13(51): e76527","kind":"期刊论文"},{"id":"cv-paper-28","title":"X-Tacformer : Spatio-tempral Attention Model for Tactile Recognition","authors":"Hu Jiarui, …, Jiang Yongkang, He Bin","venue":"IEEE International Conference on Robotics and Automation (ICRA)","year":2024,"doi":"","url":"","image":"","status":"已发表","topic":"","details":"","kind":"会议论文"}],"members":[],"news":[{"id":"n-bb","slug":"bb-20260907","hidden":false,"title":"课题组顾羲和博士空中快速停歇文章在Bioinspiration & Biomimetics在线发表！","date":"2026-09-07","summary":"以碰撞触发快速抓持，结合柔顺缓冲与被动锁定，探索无人机在杆件和天然树枝上的快速停歇。","body":"2026年9月7日，课题组顾羲和博士为第一作者、蒋永康为通讯作者的研究论文“Morphological Intelligence in Dynamic Aerial Docking: A Bistable Tension-Hinge Gripper”在Bioinspiration & Biomimetics在线发表。研究围绕无人机接触环境时的快速响应与可靠锁定问题，提出双稳态张力铰链抓持机构（BTHG），并开展了快速停歇与动态空中对接实验。\n\n让无人机在接触瞬间抓得住\n\n鸟类能够在短暂接触中抓住树枝、吸收冲击并完成停歇。让无人机具备类似能力，需要同时解决响应速度、碰撞缓冲与稳定抓持的问题：接近速度越快，留给传感、决策和执行器动作的时间就越短，接触冲击也越容易扰动飞行姿态。\n\n受鸟类腿爪系统启发，团队将快速接触响应融入机构本体。接触目标时，碰撞推动机构跨越弹性能垒，触发双稳态构型跃迁，由张开状态转入锁定状态。分段铰链与弹性结构同时提供柔顺变形和冲击缓冲，锁定后无需持续供能维持抓持。\n\n机构测试表明，BTHG可在0.16秒内完成触发跃迁。这里的0.16秒对应机构从触发到锁定的响应过程；飞行接近、接触和姿态稳定则由整机实验进一步验证。\n\n在飞行中停歇、释放与再起飞\n\n团队将机构与机载视觉和飞行控制系统集成，在水平杆实验中展示了接近、被动锁定、停歇、主动释放与再次起飞的完整过程，并在最高1.4米/秒的实测接近速度下完成快速停靠。\n\n从规则杆件走向天然树枝\n\n除了水平杆停歇，研究还展示了竖直杆停靠后的导向滑移。在室外天然树枝上，团队采用预设控制序列并配合人工安全监督，演示接近、锁定、停驻与脱离过程，观察机构对真实树枝几何和弹性的适应能力。\n\n这项工作将接触瞬间的快速响应交给物理机构，为机械设计与飞行控制协同提供了新的实验实例，也为无人机停驻观测和持续物理交互提供了研究基础。\n\n论文信息\n\nMorphological Intelligence in Dynamic Aerial Docking: A Bistable Tension-Hinge Gripper\n\n作者：Xihe Gu, Yongkang Jiang*, Pengliang Dai, Zhaojie Wang, Bin He\n期刊：Bioinspiration & Biomimetics\n在线发表：2026年9月7日\nDOI：10.1088/1748-3190/ae8f97","image":"../media/bb-2026-movie-s5-poster.webp","video":"../media/bb-2026-movie-s5.mp4","url":"https://doi.org/10.1088/1748-3190/ae8f97","blocks":[{"type":"paragraph","text":"2026年9月7日，课题组顾羲和博士为第
